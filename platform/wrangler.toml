# Prompted platform: development preview on Cloudflare Workers (free plan).
# Serves https://readprompted.org (still in preview mode: noindex, dry-run sending) and keeps the
# original address https://prompted-platform-dev.readprompted.workers.dev working as well.
name = "prompted-platform-dev"
main = "src/worker/entry.embedded.mjs" # the Worker with the built site packaged inside (see src/worker/assets.mjs)
compatibility_date = "2026-06-01"
workers_dev = true
preview_urls = false   # no extra per-version public addresses

# The owner's domain (registered at Cloudflare Registrar, November 2026). Email links and the sender
# address share this one domain.
routes = [
  { pattern = "readprompted.org", custom_domain = true },
  { pattern = "www.readprompted.org", custom_domain = true },   # redirected to the bare domain by the Worker
]

[[d1_databases]]
binding = "DB"
database_name = "prompted-dev"
database_id = "a282897c-cac0-4fcf-87dd-87a1adb49193" # preview database (an id, not a secret)
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"] # advances scheduled sends in small chunks; idle runs do almost nothing

[vars]
SITE_ENV = "preview"            # "production" only after an approved cutover
SITE_URL = "https://readprompted.org"
SEND_MODE = "dryrun"            # "live" sends real email; in preview only to TEST_RECIPIENTS
DOUBLE_OPT_IN = "true"
# Order of preference. A provider is skipped until its credentials are stored as secrets.
EMAIL_PROVIDERS = "ses,brevo,resend,gmail"
# Amazon SES: the AWS region the sending account lives in. Keys are secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY).
SES_REGION = "us-east-1"
# The SES configuration set that carries event reports (bounces, complaints, deliveries) to the SNS topic.
SES_CONFIGURATION_SET = "prompted-newsletter"
# "on" sends the issue in bulk requests (up to a second's worth of people each). Needs the access key to be
# allowed ses:SendBulkEmail; until the owner adds that permission it stays off and SES sends one by one.
SES_BULK = ""
FROM_NAME = "Prompted"
# The address issues are sent from once Brevo is connected. Mail sent to it is forwarded to the owner.
FROM_EMAIL = "brief@readprompted.org"
# Signup confirmations on the preview are recorded but not emailed. Set to "live" only with the owner's
# approval; even then they can only reach TEST_RECIPIENTS.
PREVIEW_CONFIRMATIONS = ""
SEND_CHUNK = "20"
QUOTA_RESERVE = "10"
# Off by default: tracking pixels and redirect links make mail from a new sender look like bulk mail.
# Turn on only once the sender has an established reputation.
TRACK_OPENS = "false"
TRACK_CLICKS = "false"
# Warm-up: cap real sends per day and raise the cap gradually. Empty = no warm-up cap.
# Format: start date, first-day cap, daily growth factor. Example: "2026-12-01,20,1.25"
WARMUP = ""
# Kept out of this public repository and stored as Worker secrets (wrangler secret put):
#   personal details: POSTAL_ADDRESS, TEST_RECIPIENTS, FROM_EMAIL, GMAIL_FROM_EMAIL, REPLY_TO
#   credentials: ADMIN_PASSWORD_HASH, SESSION_SECRET, WEBHOOK_SECRET,
#   BREVO_API_KEY, RESEND_API_KEY, GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN
